name: ci
on: [push, pull_request]
jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile server and tools (stdlib only)
        run: python -m py_compile app.py tools/build_db.py tools/prefetch_media.py
